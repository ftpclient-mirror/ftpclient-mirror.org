<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Unofficial FileZilla software mirror. Download FTP client binaries for Windows, Linux, and macOS.">
    <meta name="keywords" content="FileZilla, FTP client, mirror, download, Windows, Linux, macOS">

    <meta property="og:title" content="FTP Client Mirror">
    <meta property="og:description" content="Unofficial FileZilla software mirror. Download FTP client binaries for Windows, Linux, and macOS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ftpclient-mirror.org">
    <meta property="og:image" content="https://ftpclient-mirror.org/logo.webp">

    <title>FTP Client Mirror</title>
    <link rel="icon" type="image/webp" href="logo.webp">
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #7f8c8d;
            --border-color: #e0e0e0;
            --hover-bg: #f8f9fa;
            --link-color: #3498db;
            --table-header-bg: #2c3e50;
            --table-header-text: white;
            --disclaimer-bg: #fff3cd;
            --disclaimer-border: #ffc107;
            --shadow: rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-tertiary: #909090;
                --border-color: #404040;
                --hover-bg: #3a3a3a;
                --link-color: #5dade2;
                --table-header-bg: #2c3e50;
                --table-header-text: #e0e0e0;
                --disclaimer-bg: #3d3520;
                --disclaimer-border: #d4a017;
                --shadow: rgba(0,0,0,0.3);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-primary);
            padding: 2rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-secondary);
            padding-top: 1.6rem;
            padding-left: 1.6rem;
            padding-right: 1.6rem;
            padding-bottom: 1.3rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 0.1rem;
        }
        .version {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .disclaimer {
            background: var(--disclaimer-bg);
            border-bottom: 4px solid var(--disclaimer-border);
            text-align: center;
            padding: 1rem;
            margin-bottom: 0.1rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        tr:hover {
            background: var(--hover-bg);
        }
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .checksum {
            color: var(--text-tertiary);
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
        .loading {
            text-align: center;
            padding-left: 2rem;
            padding-right: 2rem;
            padding-top: 1rem;
            padding-bottom: 1rem;
            color: var(--text-tertiary);
        }
        footer {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            .container {
                padding-left: 0.8rem;
                padding-right: 0.8rem;
                padding-top: 1.2rem;
                padding-bottom: 1rem;
            }
            th, td {
                padding: 0.5rem;
                font-size: 0.9rem;
            }
            .checksum {
                display: block;
                margin-left: 0;
                margin-top: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.webp" alt="FTP Client Mirror" class="logo">
            <div class="version" id="version">Loading...</div>
        </div>

        <div class="disclaimer">
            <strong>Unofficial Mirror</strong> —
            This page is not affiliated with the FileZilla project.
        </div>

        <div id="content" class="loading">
            Loading...
        </div>

        <footer>
            ftpclient-mirror.org | 2025
        </footer>
    </div>

    <script>
        const CDN_URL = 'https://cdn.ftpclient-mirror.org';

        async function loadMirror() {
            try {
                const response = await fetch(`${CDN_URL}/latest.json`);
                const data = await response.json();

                document.getElementById('version').textContent =
                    `Version ${data.version} • ${data.date}`;

                const content = document.getElementById('content');
                content.innerHTML = '';

                const table = document.createElement('table');

                table.appendChild(createSection('Windows', [
                    { name: 'Windows 64-bit Setup (.exe)', path: data.files.windows.win64_setup },
                    { name: 'Windows 64-bit Portable (.zip)', path: data.files.windows.win64_zip },
                    { name: 'Windows 32-bit Setup (.exe)', path: data.files.windows.win32_setup },
                    { name: 'Windows 32-bit Portable (.zip)', path: data.files.windows.win32_zip }
                ]));

                table.appendChild(createSection('Linux', [
                    { name: 'Linux x86_64 (.tar.xz)', path: data.files.linux.x86_64 },
                    { name: 'Linux i686 (.tar.xz)', path: data.files.linux.i686 }
                ]));

                table.appendChild(createSection('macOS', [
                    { name: 'macOS ARM64 (Apple Silicon)', path: data.files.macos.arm64 },
                    { name: 'macOS x86 (Intel)', path: data.files.macos.x86 }
                ]));

                table.appendChild(createSection('Source', [
                    { name: 'Source Code', path: data.files.source },
                    { name: 'SHA512 Checksums', path: data.checksums.sha512 }
                ]));

                content.appendChild(table);

            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<p style="color: red; text-align: center;">Failed to load data.</p>';
                console.error('Error:', error);
            }
        }

        function createSection(title, files) {
            const fragment = document.createDocumentFragment();

            const headerRow = document.createElement('tr');
            const headerCell = document.createElement('th');
            headerCell.textContent = title;
            headerRow.appendChild(headerCell);
            fragment.appendChild(headerRow);

            files.forEach(file => {
                const row = document.createElement('tr');
                const cell = document.createElement('td');

                const link = document.createElement('a');
                link.href = `${CDN_URL}/${file.path}`;
                link.textContent = file.name;
                cell.appendChild(link);

                const checksumLink = document.createElement('a');
                checksumLink.href = `${CDN_URL}/${file.path}.sha256sum`;
                checksumLink.className = 'checksum';
                checksumLink.textContent = '(checksum)';
                cell.appendChild(checksumLink);

                row.appendChild(cell);
                fragment.appendChild(row);
            });

            return fragment;
        }

        loadMirror();
    </script>
</body>
</html>
